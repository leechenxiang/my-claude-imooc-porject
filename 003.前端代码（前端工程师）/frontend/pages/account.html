<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账户管理 - 财务管家</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #FFF9F5;
    }
    .material-symbols-outlined { font-variation-settings: 'FILL' 1; }

    .header-gradient {
      background: linear-gradient(135deg, #FFB7C5 0%, #FF8FA3 50%, #C9B8E8 100%) !important;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 12px rgba(255, 183, 197, 0.15);
    }

    .account-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #FFF0F3;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .account-item:hover {
      transform: scale(1.02);
    }

    .account-icon {
      font-size: 28px;
    }

    .account-name {
      flex: 1;
      font-size: 16px;
      font-weight: 500;
      color: #1B1C1C;
    }

    .btn-add {
      width: 100%;
      padding: 14px;
      background: white;
      border: 2px dashed #FFB7C5;
      border-radius: 12px;
      color: #FF8FA3;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-add:hover {
      background: #FFF0F3;
    }

    .emoji-picker {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      padding: 12px;
      background: white;
      border-radius: 12px;
      margin-top: 12px;
    }

    .emoji-item {
      font-size: 24px;
      text-align: center;
      padding: 8px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .emoji-item:hover {
      background: #FFF0F3;
    }

    .emoji-item.selected {
      background: #FFF0F3;
    }

    .fab-button {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #FFB7C5 0%, #FF8FA3 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(255, 143, 163, 0.4);
      z-index: 100;
    }

    .fab-button:hover {
      transform: translateX(-50%) scale(1.05);
      box-shadow: 0 12px 28px rgba(255, 143, 163, 0.45);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      color: #8E8E8E;
    }

    .nav-item.active {
      background: #FFF0F3;
      color: #FF8FA3;
    }

    .input-field {
      width: 100%;
      padding: 12px 16px;
      background: #F5F3F3;
      border-radius: 12px;
      border: 1px solid #E5E5E5;
      outline: none;
      font-size: 16px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #8E8E8E;
    }
  </style>
</head>
<body style="background: #FFF9F5; min-height: 100vh; padding-bottom: 90px;">
  <!-- 顶部 -->
  <div class="header-gradient pt-6 pb-8 px-5 rounded-b-2xl">
    <div style="color: white; display: flex; align-items: center;">
      <span style="font-size: 20px; font-weight: 600;">账户管理</span>
    </div>
  </div>

  <div style="padding: 20px;">
    <!-- 账户列表 -->
    <div id="accountList" class="card" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;">
    </div>

    <!-- 添加账户按钮 -->
    <button class="btn-add" onclick="showAddModal()">
      + 添加账户
    </button>
  </div>

  <!-- 悬浮按钮 -->
  <a href="add_record.html" class="fab-button">
    <svg t="1777462897685" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="1642" width="24" height="24"><path d="M612.37248 411.62752V30.208h-200.74496v381.41952H30.208v200.74496h381.41952v381.41952h200.74496V612.37248h381.41952v-200.74496z" p-id="1643" fill="#ffffff"></path></svg>
  </a>

  <!-- 底部导航 -->
  <nav style="position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #EFEDED; display: flex; justify-content: space-around; padding: 12px 0; padding-bottom: 24px; z-index: 50;">
    <a href="dashboard.html" class="nav-item">
      <span>首页</span>
    </a>
    <a href="statistics.html" class="nav-item">
      <span>统计</span>
    </a>
    <div style="width: 56px;"></div>
    <a href="transaction_history.html" class="nav-item">
      <span>明细</span>
    </a>
    <a href="settings.html" class="nav-item active">
      <span>设置</span>
    </a>
  </nav>

  <!-- 添加/编辑账户弹窗 -->
  <div id="accountModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 16px; padding: 20px; width: 90%; max-width: 360px;">
      <h3 id="modalTitle" style="font-size: 18px; font-weight: 600; margin-bottom: 16px;">添加账户</h3>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 14px; color: #514345; margin-bottom: 6px;">选择图标</label>
        <div class="emoji-picker" id="emojiPicker">
        </div>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 14px; color: #514345; margin-bottom: 6px;">账户名称</label>
        <input type="text" id="accountNameInput" class="input-field" placeholder="请输入账户名称">
      </div>

      <div style="display: flex; gap: 12px; margin-bottom: 12px;">
        <button onclick="saveAccount()" style="flex: 1; padding: 14px; background: linear-gradient(135deg, #FFB7C5 0%, #FF8FA3 100%); color: white; font-weight: 600; border-radius: 12px; border: none; cursor: pointer;">保存</button>
        <button onclick="closeModal()" style="flex: 1; padding: 14px; background: #F5F3F3; color: #514345; font-weight: 500; border-radius: 12px; border: none; cursor: pointer;">取消</button>
      </div>

      <button id="deleteBtn" onclick="deleteAccount()" style="width: 100%; padding: 12px; background: #FFF0F3; color: #FFA09B; font-weight: 500; border-radius: 12px; border: none; cursor: pointer; display: none;">删除此账户</button>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3001/api';

    const defaultEmojis = ['💰', '💵', '🪙', '🏦', '💳', '📱', '🧾', '🎁', '🍚', '🛒', '🚗', '🏠', '💼', '📈', '💡', '❤️'];

    let accounts = [];
    let editingId = null;
    let selectedEmoji = '💰';

    // 检查是否已登录
    function checkLogin() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
      }
    }

    // 初始化emoji选择器
    function initEmojiPicker() {
      const emojiPicker = document.getElementById('emojiPicker');
      emojiPicker.innerHTML = '';
      defaultEmojis.forEach(emoji => {
        const span = document.createElement('span');
        span.className = 'emoji-item';
        span.textContent = emoji;
        span.onclick = () => selectEmoji(emoji);
        emojiPicker.appendChild(span);
      });
    }

    // 加载账户
    async function loadAccounts() {
      const token = localStorage.getItem('token');
      if (!token) return;

      try {
        const response = await fetch(`${API_BASE}/accounts`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        const data = await response.json();

        if (data.success) {
          accounts = data.data;
          renderAccounts();
        }
      } catch (error) {
        console.error('加载账户失败:', error);
      }
    }

    function renderAccounts() {
      const list = document.getElementById('accountList');
      list.innerHTML = '';

      if (accounts.length === 0) {
        list.innerHTML = '<div class="empty-state">暂无账户，点击添加</div>';
        return;
      }

      accounts.forEach(account => {
        const div = document.createElement('div');
        div.className = 'account-item';
        div.onclick = () => editAccount(account.id);
        div.innerHTML = `
          <span class="account-icon">${account.icon}</span>
          <span class="account-name">${account.name}</span>
        `;
        list.appendChild(div);
      });
    }

    function selectEmoji(emoji) {
      selectedEmoji = emoji;
      document.querySelectorAll('.emoji-item').forEach(item => {
        item.classList.toggle('selected', item.textContent === emoji);
      });
    }

    function showAddModal() {
      editingId = null;
      document.getElementById('modalTitle').textContent = '添加账户';
      document.getElementById('accountNameInput').value = '';
      selectedEmoji = '💰';
      document.getElementById('accountModal').style.display = 'flex';
      document.getElementById('deleteBtn').style.display = 'none';
      initEmojiPicker();
      selectEmoji('💰');
    }

    function editAccount(id) {
      const account = accounts.find(a => a.id === id);
      if (account) {
        editingId = id;
        document.getElementById('modalTitle').textContent = '编辑账户';
        document.getElementById('accountNameInput').value = account.name;
        selectedEmoji = account.icon;
        document.getElementById('accountModal').style.display = 'flex';
        document.getElementById('deleteBtn').style.display = 'block';
        initEmojiPicker();
        selectEmoji(account.icon);
      }
    }

    function closeModal() {
      document.getElementById('accountModal').style.display = 'none';
    }

    async function saveAccount() {
      const token = localStorage.getItem('token');
      const name = document.getElementById('accountNameInput').value.trim();

      if (!name) {
        alert('请输入账户名称');
        return;
      }

      const accountData = {
        name: name,
        icon: selectedEmoji
      };

      try {
        let response;
        if (editingId) {
          response = await fetch(`${API_BASE}/accounts/${editingId}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(accountData)
          });
        } else {
          response = await fetch(`${API_BASE}/accounts`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(accountData)
          });
        }

        const data = await response.json();

        if (data.success) {
          closeModal();
          loadAccounts();
        } else {
          alert(data.message || '保存失败');
        }
      } catch (error) {
        console.error('保存账户失败:', error);
        alert('保存失败，请重试');
      }
    }

    async function deleteAccount() {
      if (!editingId) return;

      if (confirm('确定要删除这个账户吗？')) {
        const token = localStorage.getItem('token');

        try {
          const response = await fetch(`${API_BASE}/accounts/${editingId}`, {
            method: 'DELETE',
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });

          const data = await response.json();

          if (data.success) {
            closeModal();
            loadAccounts();
          } else {
            alert(data.message || '删除失败');
          }
        } catch (error) {
          console.error('删除账户失败:', error);
          alert('删除失败，请重试');
        }
      }
    }

    // 初始渲染
    window.addEventListener('DOMContentLoaded', function() {
      checkLogin();
      loadAccounts();
    });
  </script>
</body>
</html>
