<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>记一笔 - 财务管家</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #FFF9F5;
    }
    .material-symbols-outlined { font-variation-settings: 'FILL' 1; }

    .header-gradient {
      background: linear-gradient(135deg, #FFB7C5 0%, #FF8FA3 50%, #C9B8E8 100%) !important;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 12px rgba(255, 183, 197, 0.15);
    }

    .category-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 12px 8px;
      background: #FFF0F3;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category-option.selected {
      background: #FFB7C5;
      color: white;
    }

    .category-option:active {
      transform: scale(0.95);
    }

    .category-icon {
      font-size: 22px;
    }

    .category-name {
      font-size: 11px;
    }

    .type-btn {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .type-btn.expense {
      background: rgba(255, 160, 155, 0.2);
      color: #FFA09B;
    }

    .type-btn.expense.selected {
      background: #FFA09B;
      color: white;
    }

    .type-btn.income {
      background: rgba(125, 211, 192, 0.2);
      color: #7DD3C0;
    }

    .type-btn.income.selected {
      background: #7DD3C0;
      color: white;
    }

    .account-chip {
      padding: 8px 16px;
      background: #FFF0F3;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .account-chip.selected {
      background: #FFB7C5;
      color: white;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      background: white;
      border: 2px solid #E5E5E5;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      border-color: #FFB7C5;
    }

    .btn-save {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #FFB7C5 0%, #FF8FA3 100%);
      color: white;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-save:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(255, 143, 163, 0.4);
    }

    .btn-save:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      color: #8E8E8E;
    }

    .nav-item.active {
      background: #FFF0F3;
      color: #FF8FA3;
    }

    .fab-button {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #FFB7C5 0%, #FF8FA3 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(255, 143, 163, 0.4);
      z-index: 100;
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: #8E8E8E;
    }
  </style>
</head>
<body style="background: #FFF9F5; min-height: 100vh; padding-bottom: 90px;">
  <!-- 顶部 -->
  <div class="header-gradient pt-6 pb-8 px-5 rounded-b-2xl">
    <div style="color: white; display: flex; align-items: center;">
      <span style="font-size: 20px; font-weight: 600;">记一笔</span>
    </div>
  </div>

  <div style="padding: 20px;">
    <!-- 类型选择 -->
    <div style="display: flex; gap: 12px; margin-bottom: 20px;">
      <button class="type-btn expense selected" onclick="switchType('expense')" id="expenseBtn">💸 支出</button>
      <button class="type-btn income" onclick="switchType('income')" id="incomeBtn">💰 收入</button>
    </div>

    <!-- 分类选择 -->
    <div style="margin-bottom: 20px;">
      <h3 style="font-size: 14px; font-weight: 500; color: #514345; margin-bottom: 12px;">选择分类</h3>
      <div id="categoryGrid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;">
      </div>
    </div>

    <!-- 金额 -->
    <div style="margin-bottom: 20px;">
      <h3 style="font-size: 14px; font-weight: 500; color: #514345; margin-bottom: 12px;">金额</h3>
      <div style="position: relative;">
        <span style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 24px; color: #8E8E8E;">¥</span>
        <input type="number" id="amountInput" class="input-field" style="padding-left: 40px; font-size: 24px; font-weight: 700;" placeholder="0.00">
      </div>
    </div>

    <!-- 账户 -->
    <div style="margin-bottom: 20px;">
      <h3 style="font-size: 14px; font-weight: 500; color: #514345; margin-bottom: 12px;">账户</h3>
      <div id="accountList" style="display: flex; gap: 8px; flex-wrap: wrap;">
      </div>
    </div>

    <!-- 备注 -->
    <div style="margin-bottom: 24px;">
      <h3 style="font-size: 14px; font-weight: 500; color: #514345; margin-bottom: 12px;">备注（可选）</h3>
      <input type="text" id="remarkInput" class="input-field" placeholder="添加备注...">
    </div>

    <!-- 保存按钮 -->
    <button class="btn-save" onclick="saveTransaction()" id="saveBtn">
      保存
    </button>
  </div>

  <!-- 底部导航 -->
  <nav style="position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #EFEDED; display: flex; justify-content: space-around; padding: 12px 0; padding-bottom: 24px; z-index: 50;">
    <a href="dashboard.html" class="nav-item">
      <span>首页</span>
    </a>
    <a href="statistics.html" class="nav-item">
      <span>统计</span>
    </a>
    <div style="width: 56px;"></div>
    <a href="transaction_history.html" class="nav-item">
      <span>明细</span>
    </a>
    <a href="settings.html" class="nav-item">
      <span>设置</span>
    </a>
  </nav>

  <script>
    const API_BASE = 'http://localhost:3001/api';

    let currentType = 'expense';
    let expenseCategories = [];
    let incomeCategories = [];
    let accounts = [];
    let selectedCategoryId = null;
    let selectedAccountId = null;

    // 检查是否已登录
    function checkLogin() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
      }
    }

    // 切换类型
    function switchType(type) {
      currentType = type;
      document.getElementById('expenseBtn').className = type === 'expense' ? 'type-btn expense selected' : 'type-btn expense';
      document.getElementById('incomeBtn').className = type === 'income' ? 'type-btn income selected' : 'type-btn income';

      selectedCategoryId = null;
      renderCategories();
    }

    // 加载分类
    async function loadCategories() {
      const token = localStorage.getItem('token');
      if (!token) return;

      try {
        // 分别获取支出和收入分类
        const [expenseRes, incomeRes] = await Promise.all([
          fetch(`${API_BASE}/categories?type=expense`, {
            headers: { 'Authorization': `Bearer ${token}` }
          }),
          fetch(`${API_BASE}/categories?type=income`, {
            headers: { 'Authorization': `Bearer ${token}` }
          })
        ]);

        const [expenseData, incomeData] = await Promise.all([
          expenseRes.json(),
          incomeRes.json()
        ]);

        if (expenseData.success && incomeData.success) {
          expenseCategories = expenseData.data;
          incomeCategories = incomeData.data;
          renderCategories();
        }
      } catch (error) {
        console.error('加载分类失败:', error);
      }
    }

    // 渲染分类
    function renderCategories() {
      const grid = document.getElementById('categoryGrid');
      grid.innerHTML = '';

      const categories = currentType === 'expense' ? expenseCategories : incomeCategories;

      if (categories.length === 0) {
        grid.innerHTML = '<div class="empty-state" style="grid-column: span 5;">暂无分类，请在设置中添加</div>';
        return;
      }

      categories.forEach(cat => {
        const div = document.createElement('div');
        div.className = 'category-option' + (selectedCategoryId === cat.id ? ' selected' : '');
        div.onclick = () => selectCategory(cat.id);
        div.innerHTML = `
          <span class="category-icon">${cat.icon}</span>
          <span class="category-name">${cat.name}</span>
        `;
        grid.appendChild(div);
      });

      // 自动选择第一个
      if (!selectedCategoryId && categories.length > 0) {
        selectCategory(categories[0].id);
      }
    }

    // 选择分类
    function selectCategory(id) {
      selectedCategoryId = id;
      document.querySelectorAll('.category-option').forEach((el, idx) => {
        const categories = currentType === 'expense' ? expenseCategories : incomeCategories;
        if (categories[idx]) {
          el.classList.toggle('selected', categories[idx].id === id);
        }
      });
    }

    // 加载账户
    async function loadAccounts() {
      const token = localStorage.getItem('token');
      if (!token) return;

      try {
        const response = await fetch(`${API_BASE}/accounts`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        const data = await response.json();

        if (data.success) {
          accounts = data.data;
          renderAccounts();
        }
      } catch (error) {
        console.error('加载账户失败:', error);
      }
    }

    // 渲染账户
    function renderAccounts() {
      const list = document.getElementById('accountList');
      list.innerHTML = '';

      if (accounts.length === 0) {
        list.innerHTML = '<div class="empty-state">暂无账户，请在设置中添加</div>';
        return;
      }

      accounts.forEach(account => {
        const span = document.createElement('span');
        span.className = 'account-chip' + (selectedAccountId === account.id ? ' selected' : '');
        span.onclick = () => selectAccount(account.id);
        span.textContent = `${account.icon} ${account.name}`;
        list.appendChild(span);
      });

      // 自动选择第一个
      if (!selectedAccountId && accounts.length > 0) {
        selectAccount(accounts[0].id);
      }
    }

    // 选择账户
    function selectAccount(id) {
      selectedAccountId = id;
      document.querySelectorAll('.account-chip').forEach((el, idx) => {
        if (accounts[idx]) {
          el.classList.toggle('selected', accounts[idx].id === id);
        }
      });
    }

    // 保存交易
    async function saveTransaction() {
      const token = localStorage.getItem('token');
      const amount = parseFloat(document.getElementById('amountInput').value);
      const remark = document.getElementById('remarkInput').value.trim();

      if (!amount || amount <= 0) {
        alert('请输入有效金额');
        return;
      }

      if (!selectedCategoryId) {
        alert('请选择分类');
        return;
      }

      if (!selectedAccountId) {
        alert('请选择账户');
        return;
      }

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner"></span> 保存中...';

      const transactionData = {
        type: currentType,
        category_id: selectedCategoryId,
        account_id: selectedAccountId,
        amount: amount,
        remark: remark,
        date: new Date().toISOString()
      };

      try {
        const response = await fetch(`${API_BASE}/transactions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(transactionData)
        });

        const data = await response.json();

        if (data.success) {
          // 跳转到首页
          window.location.href = 'dashboard.html';
        } else {
          btn.disabled = false;
          btn.textContent = '保存';
          alert(data.message || '保存失败');
        }
      } catch (error) {
        console.error('保存交易失败:', error);
        btn.disabled = false;
        btn.textContent = '保存';
        alert('保存失败，请重试');
      }
    }

    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', function() {
      checkLogin();
      loadCategories();
      loadAccounts();
    });
  </script>
</body>
</html>
