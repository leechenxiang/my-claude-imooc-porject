<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>记一笔 - 财务管家</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #FFF9F5;
    }
    .material-symbols-outlined { font-variation-settings: 'FILL' 1; }

    /* 强制渐变 */
    .header-gradient {
      background: linear-gradient(135deg, #FFB7C5 0%, #FF8FA3 50%, #C9B8E8 100%) !important;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 12px rgba(255, 183, 197, 0.15);
    }

    .category-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 12px 8px;
      background: #FFF0F3;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category-option.selected {
      background: #FFB7C5;
      color: white;
    }

    .category-option:active {
      transform: scale(0.95);
    }

    .type-btn {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .type-btn.expense {
      background: rgba(255, 160, 155, 0.2);
      color: #FFA09B;
    }

    .type-btn.expense.selected {
      background: #FFA09B;
      color: white;
    }

    .type-btn.income {
      background: rgba(125, 211, 192, 0.2);
      color: #7DD3C0;
    }

    .type-btn.income.selected {
      background: #7DD3C0;
      color: white;
    }

    .account-chip {
      padding: 8px 16px;
      background: #FFF0F3;
      border-radius: 10px;
      font-size: 14px;
    }

    .account-chip.selected {
      background: #FFB7C5;
      color: white;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      background: white;
      border: 2px solid #E5E5E5;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      border-color: #FFB7C5;
    }

    .btn-save {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #FFB7C5 0%, #FF8FA3 100%);
      color: white;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-save:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(255, 143, 163, 0.4);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      color: #8E8E8E;
    }

    .nav-item.active {
      background: #FFF0F3;
      color: #FF8FA3;
    }

    .fab-button {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #FFB7C5 0%, #FF8FA3 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(255, 143, 163, 0.4);
      z-index: 100;
    }
  </style>
</head>
<body style="background: #FFF9F5; min-height: 100vh; padding-bottom: 90px;">
  <!-- 顶部 -->
  <div class="header-gradient pt-6 pb-8 px-5 rounded-b-2xl">
    <div style="color: white; display: flex; align-items: center;">
      <span style="font-size: 20px; font-weight: 600;">记一笔</span>
    </div>
  </div>

  <div style="padding: 20px;">
    <!-- 类型选择 -->
    <div style="display: flex; gap: 12px; margin-bottom: 20px;">
      <button class="type-btn expense selected" style="flex: 1;">💸 支出</button>
      <button class="type-btn income" style="flex: 1;">💰 收入</button>
    </div>

    <!-- 分类选择 -->
    <div style="margin-bottom: 20px;">
      <h3 style="font-size: 14px; font-weight: 500; color: #514345; margin-bottom: 12px;">选择分类</h3>
      <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;">
        <div class="category-option selected">
          <span style="font-size: 22px;">🍚</span>
          <span style="font-size: 11px;">餐饮</span>
        </div>
        <div class="category-option">
          <span style="font-size: 22px;">🚗</span>
          <span style="font-size: 11px;">交通</span>
        </div>
        <div class="category-option">
          <span style="font-size: 22px;">🛒</span>
          <span style="font-size: 11px;">购物</span>
        </div>
        <div class="category-option">
          <span style="font-size: 22px;">🎬</span>
          <span style="font-size: 11px;">娱乐</span>
        </div>
        <div class="category-option">
          <span style="font-size: 22px;">🏠</span>
          <span style="font-size: 11px;">住房</span>
        </div>
        <div class="category-option">
          <span style="font-size: 22px;">💊</span>
          <span style="font-size: 11px;">医疗</span>
        </div>
        <div class="category-option">
          <span style="font-size: 22px;">📱</span>
          <span style="font-size: 11px;">通讯</span>
        </div>
        <div class="category-option">
          <span style="font-size: 22px;">👔</span>
          <span style="font-size: 11px;">服饰</span>
        </div>
        <div class="category-option">
          <span style="font-size: 22px;">🎁</span>
          <span style="font-size: 11px;">人情</span>
        </div>
        <div class="category-option">
          <span style="font-size: 22px;">📦</span>
          <span style="font-size: 11px;">其他</span>
        </div>
      </div>
    </div>

    <!-- 金额 -->
    <div style="margin-bottom: 20px;">
      <h3 style="font-size: 14px; font-weight: 500; color: #514345; margin-bottom: 12px;">金额</h3>
      <div style="position: relative;">
        <span style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 24px; color: #8E8E8E;">¥</span>
        <input type="number" class="input-field" style="padding-left: 40px; font-size: 24px; font-weight: 700;" placeholder="0.00">
      </div>
    </div>

    <!-- 账户 -->
    <div style="margin-bottom: 20px;">
      <h3 style="font-size: 14px; font-weight: 500; color: #514345; margin-bottom: 12px;">账户</h3>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <span class="account-chip selected">💵 现金</span>
        <span class="account-chip">📱 微信</span>
        <span class="account-chip">🟢 支付宝</span>
      </div>
    </div>

    <!-- 备注 -->
    <div style="margin-bottom: 24px;">
      <h3 style="font-size: 14px; font-weight: 500; color: #514345; margin-bottom: 12px;">备注（可选）</h3>
      <input type="text" class="input-field" placeholder="添加备注...">
    </div>

    <!-- 保存按钮 -->
    <a href="dashboard.html" class="btn-save">
      保存
    </a>
  </div>

  <!-- 底部导航 -->
  <nav style="position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #EFEDED; display: flex; justify-content: space-around; padding: 12px 0; padding-bottom: 24px; z-index: 50;">
    <a href="dashboard.html" class="nav-item">
      <span>首页</span>
    </a>
    <a href="statistics.html" class="nav-item">
      <span>统计</span>
    </a>
    <div style="width: 56px;"></div>
    <a href="transaction_history.html" class="nav-item">
      <span>明细</span>
    </a>
    <a href="settings.html" class="nav-item">
      <span>设置</span>
    </a>
  </nav>
</body>
</html>
