<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统计 - 财务管家</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #FFF9F5;
    }
    .material-symbols-outlined { font-variation-settings: 'FILL' 1; }

    .header-gradient {
      background: linear-gradient(135deg, #FFB7C5 0%, #FF8FA3 50%, #C9B8E8 100%) !important;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 12px rgba(255, 183, 197, 0.15);
    }

    .btn-export {
      width: 100%;
      padding: 14px;
      background: white;
      border: 2px solid #FFB7C5;
      border-radius: 12px;
      color: #FF8FA3;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-export:hover {
      background: #FFF0F3;
    }

    .year-select {
      padding: 8px 16px;
      background: white;
      border: 1px solid #E5E5E5;
      border-radius: 12px;
      font-size: 16px;
      color: #1B1C1C;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      color: #8E8E8E;
    }

    .nav-item.active {
      background: #FFF0F3;
      color: #FF8FA3;
    }

    .fab-button {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #FFB7C5 0%, #FF8FA3 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(255, 143, 163, 0.4);
      z-index: 100;
    }

    .fab-button:hover {
      transform: translateX(-50%) scale(1.05);
      box-shadow: 0 12px 28px rgba(255, 143, 163, 0.45);
    }
  </style>
</head>
<body style="background: #FFF9F5; min-height: 100vh; padding-bottom: 10px;">
  <!-- 顶部 -->
  <div class="header-gradient pt-6 pb-10 px-5 rounded-b-2xl">
    <div style="color: white; display: flex; align-items: center;">
      <span style="font-size: 20px; font-weight: 600;">统计分析</span>
    </div>
  </div>

  <div style="padding: 20px; margin-top: 0px;">
    <!-- 年份选择 -->
    <div style="margin-bottom: 16px;">
      <select id="yearSelect" class="year-select" onchange="loadStatistics()">
        <option value="2026">2026年</option>
        <option value="2025">2025年</option>
        <option value="2024">2024年</option>
      </select>
    </div>

    <!-- 本月概览 -->
    <div class="card" style="display: flex; justify-content: space-around; text-align: center; margin-bottom: 16px;">
      <div>
        <p style="font-size: 12px; color: #8E8E8E;">收入</p>
        <p id="totalIncome" style="font-size: 18px; font-weight: 700; color: #7DD3C0;">¥0</p>
      </div>
      <div>
        <p style="font-size: 12px; color: #8E8E8E;">支出</p>
        <p id="totalExpense" style="font-size: 18px; font-weight: 700; color: #FFA09B;">¥0</p>
      </div>
      <div>
        <p style="font-size: 12px; color: #8E8E8E;">结余</p>
        <p id="totalBalance" style="font-size: 18px; font-weight: 700; color: #FF8FA3;">¥0</p>
      </div>
    </div>

    <!-- 支出分类饼图 -->
    <div class="card" style="margin-bottom: 16px;">
      <h3 style="font-size: 16px; font-weight: 600; color: #1B1C1C; margin-bottom: 16px;">支出分类</h3>
      <div style="height: 180px; width: 100%;">
        <canvas id="expenseChart" style="width: 100%; height: 100%;"></canvas>
      </div>
    </div>

    <!-- 趋势图 -->
    <div class="card" style="margin-bottom: 16px;">
      <h3 style="font-size: 16px; font-weight: 600; color: #1B1C1C; margin-bottom: 16px;">收支趋势</h3>
      <div style="height: 180px; width: 100%;">
        <canvas id="trendChart" style="width: 100%; height: 100%;"></canvas>
      </div>
    </div>

    <!-- 导出按钮 -->
    <button class="btn-export" onclick="exportData()">
      📥 导出Excel
    </button>
  </div>

  <!-- 悬浮按钮 -->
  <a href="add_record.html" class="fab-button">
    <svg t="1777462897685" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="1642" width="24" height="24"><path d="M612.37248 411.62752V30.208h-200.74496v381.41952H30.208v200.74496h381.41952v381.41952h200.74496V612.37248h381.41952v-200.74496z" p-id="1643" fill="#ffffff"></path></svg>
  </a>

  <!-- 底部导航 -->
  <nav style="position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #EFEDED; display: flex; justify-content: space-around; padding: 12px 0; padding-bottom: 24px; z-index: 50;">
    <a href="dashboard.html" class="nav-item">
      <span>首页</span>
    </a>
    <a href="statistics.html" class="nav-item active">
      <span>统计</span>
    </a>
    <div style="width: 56px;"></div>
    <a href="transaction_history.html" class="nav-item">
      <span>明细</span>
    </a>
    <a href="settings.html" class="nav-item">
      <span>设置</span>
    </a>
  </nav>

  <script>
    // API配置
    const API_BASE = 'http://localhost:3001/api';

    let expenseChart = null;
    let trendChart = null;

    // 检查是否已登录
    function checkLogin() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
      }
    }

    // 格式化金额
    function formatAmount(amount) {
      return amount ? amount.toLocaleString('zh-CN') : '0';
    }

    // 加载统计数据
    async function loadStatistics() {
      const token = localStorage.getItem('token');
      if (!token) return;

      const year = document.getElementById('yearSelect').value;

      try {
        const response = await fetch(`${API_BASE}/statistics?year=${year}`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        const data = await response.json();

        if (data.success) {
          const stats = data.data;

          // 更新概览数据
          document.getElementById('totalIncome').textContent = `¥${formatAmount(stats.yearIncome)}`;
          document.getElementById('totalExpense').textContent = `¥${formatAmount(stats.yearExpense)}`;
          document.getElementById('totalBalance').textContent = `¥${formatAmount(stats.yearBalance)}`;

          // 更新饼图
          updateExpenseChart(stats.categoryStats);

          // 更新趋势图
          updateTrendChart(stats.monthlyData);
        }
      } catch (error) {
        console.error('加载统计数据失败:', error);
      }
    }

    // 更新支出分类���图
    function updateExpenseChart(categoryData) {
      const ctx = document.getElementById('expenseChart').getContext('2d');

      const labels = categoryData.map(c => c.name);
      const values = categoryData.map(c => c.total);
      const colors = ['#FFB7C5', '#FF8FA3', '#C9B8E8', '#7DD3C0', '#FFA09B', '#FFD93D', '#6BCB77', '#FF6B6B'];

      if (expenseChart) {
        expenseChart.destroy();
      }

      expenseChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: values,
            backgroundColor: colors.slice(0, labels.length),
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { padding: 12, font: { size: 12 } } } }
        }
      });
    }

    // 更新趋势图
    function updateTrendChart(monthlyData) {
      const ctx = document.getElementById('trendChart').getContext('2d');

      const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
      const incomeData = [];
      const expenseData = [];

      for (let i = 0; i < 12; i++) {
        const monthItem = monthlyData.find(m => parseInt(m.month) === i + 1);
        incomeData.push(monthItem ? monthItem.income : 0);
        expenseData.push(monthItem ? monthItem.expense : 0);
      }

      if (trendChart) {
        trendChart.destroy();
      }

      trendChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: months,
          datasets: [
            { label: '收入', data: incomeData, borderColor: '#7DD3C0', fill: true, backgroundColor: 'rgba(125, 211, 192, 0.1)', tension: 0.4 },
            { label: '支出', data: expenseData, borderColor: '#FFA09B', fill: true, backgroundColor: 'rgba(255, 160, 155, 0.1)', tension: 0.4 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'top' } },
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    // 导出数据
    async function exportData() {
      var token = localStorage.getItem('token');
      if (!token) return;

      var year = document.getElementById('yearSelect').value;

      try {
        var response = await fetch(API_BASE + '/export?year=' + year, {
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });

        var data = await response.json();

        if (!data.success || !data.data) {
          alert(data.message || '导出失败');
          return;
        }

        // 格式化日期
        var formatDate = function(dateStr) {
          var date = new Date(dateStr);
          var y = date.getFullYear();
          var m = (date.getMonth() + 1).toString().padStart(2, '0');
          var d = date.getDate().toString().padStart(2, '0');
          var h = date.getHours().toString().padStart(2, '0');
          var min = date.getMinutes().toString().padStart(2, '0');
          var s = date.getSeconds().toString().padStart(2, '0');
          return y + '-' + m + '-' + d + ' ' + h + ':' + min + ':' + s;
        };

        // 生成CSV
        var csv = '﻿日期,类型,分类,账户,金额,备注\n';
        for (var i = 0; i < data.data.length; i++) {
          var t = data.data[i];
          var type = t.type === 'income' ? '收入' : '支出';
          csv += formatDate(t.date) + ',' + type + ',' + t.category + ',' + t.account + ',' + t.amount + ',' + t.remark + '\n';
        }

        // 下载
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        var url = window.URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = '财务管家_' + year + '.csv';
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
      } catch (error) {
        console.error('导出失败:', error);
        alert('导出失败，请重试');
      }
    }

    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', function() {
      checkLogin();
      loadStatistics();
    });
  </script>
</body>
</html>
