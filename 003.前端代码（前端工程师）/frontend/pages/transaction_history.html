<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交易明细 - 财务管家</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #FFF9F5;
    }
    .material-symbols-outlined { font-variation-settings: 'FILL' 1; }

    .header-gradient {
      background: linear-gradient(135deg, #FFB7C5 0%, #FF8FA3 50%, #C9B8E8 100%) !important;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 12px rgba(255, 183, 197, 0.15);
    }

    .chip {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      white-space: nowrap;
    }

    .chip.active {
      background: #FFB7C5;
      color: white;
    }

    .chip:not(.active) {
      background: white;
      color: #514345;
      border: 1px solid #EFEDED;
    }

    .transaction-item {
      display: flex;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #EFEDED;
    }

    .transaction-item:last-child {
      border-bottom: none;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      color: #8E8E8E;
    }

    .nav-item.active {
      background: #FFF0F3;
      color: #FF8FA3;
    }

    .fab-button {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #FFB7C5 0%, #FF8FA3 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(255, 143, 163, 0.4);
      z-index: 100;
    }

    .fab-button:hover {
      transform: translateX(-50%) scale(1.05);
      box-shadow: 0 12px 28px rgba(255, 143, 163, 0.45);
    }
  </style>
</head>
<body style="background: #FFF9F5; min-height: 100vh; padding-bottom: 10px;">
  <!-- 顶部 -->
  <div class="header-gradient pt-6 pb-8 px-5 rounded-b-2xl">
    <div style="color: white; display: flex; align-items: center;">
      <span style="font-size: 20px; font-weight: 600;">交易明细</span>
    </div>
  </div>

  <!-- 筛选 -->
  <div style="padding: 16px 20px; display: flex; gap: 8px; overflow-x: auto;">
    <span class="chip active">全部</span>
    <span class="chip">支出</span>
    <span class="chip">收入</span>
  </div>

  <!-- 交易列表 -->
  <div style="padding: 0 20px;">
    <div style="font-size: 14px; color: #8E8E8E; margin-bottom: 12px;">4月</div>
    <div class="card" style="display: flex; flex-direction: column; gap: 12px;">
      <div class="transaction-item">
        <span style="width: 40px; height: 40px; background: #FFF0F3; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 12px;">🍚</span>
        <div style="flex: 1;">
          <p style="font-size: 14px; font-weight: 500;">餐饮</p>
          <p style="font-size: 12px; color: #8E8E8E;">4/29</p>
        </div>
        <span style="font-size: 14px; font-weight: 600; color: #FFA09B;">-¥58</span>
      </div>
      <div class="transaction-item">
        <span style="width: 40px; height: 40px; background: #FFF0F3; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 12px;">🚗</span>
        <div style="flex: 1;">
          <p style="font-size: 14px; font-weight: 500; margin-right: 12px;">交通</p>
          <p style="font-size: 12px; color: #8E8E8E;">4/28</p>
        </div>
        <span style="font-size: 14px; font-weight: 600; color: #FFA09B;">-¥26</span>
      </div>
      <div class="transaction-item">
        <span style="width: 40px; height: 40px; background: #FFF0F3; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 12px;">💰</span>
        <div style="flex: 1;">
          <p style="font-size: 14px; font-weight: 500; margin-right: 12px;">工资</p>
          <p style="font-size: 12px; color: #8E8E8E;">4/25</p>
        </div>
        <span style="font-size: 14px; font-weight: 600; color: #7DD3C0;">+¥12,000</span>
      </div>
    </div>

    <div style="font-size: 14px; color: #8E8E8E; margin: 20px 0 12px;">3月</div>
    <div class="card" style="display: flex; flex-direction: column; gap: 12px;">
      <div class="transaction-item">
        <span style="width: 40px; height: 40px; background: #FFF0F3; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 12px;">🛒</span>
        <div style="flex: 1;">
          <p style="font-size: 14px; font-weight: 500; margin-right: 12px;">购物</p>
          <p style="font-size: 12px; color: #8E8E8E;">3/27</p>
        </div>
        <span style="font-size: 14px; font-weight: 600; color: #FFA09B;">-¥199</span>
      </div>
      <div class="transaction-item">
        <span style="width: 40px; height: 40px; background: #FFF0F3; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 12px;">🎁</span>
        <div style="flex: 1;">
          <p style="font-size: 14px; font-weight: 500; margin-right: 12px;">礼金</p>
          <p style="font-size: 12px; color: #8E8E8E;">3/20</p>
        </div>
        <span style="font-size: 14px; font-weight: 600; color: #7DD3C0;">+¥500</span>
      </div>
    </div>
  </div>

  <!-- 悬浮按钮 -->
  <a href="add_record.html" class="fab-button">
    <svg t="1777462897685" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="1642" width="24" height="24"><path d="M612.37248 411.62752V30.208h-200.74496v381.41952H30.208v200.74496h381.41952v381.41952h200.74496V612.37248h381.41952v-200.74496z" p-id="1643" fill="#ffffff"></path></svg>
  </a>

  <!-- 底部导航 -->
  <nav style="position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #EFEDED; display: flex; justify-content: space-around; padding: 12px 0; padding-bottom: 24px; z-index: 50;">
    <a href="dashboard.html" class="nav-item">
      <span>首页</span>
    </a>
    <a href="statistics.html" class="nav-item">
      <span>统计</span>
    </a>
    <div style="width: 56px;"></div>
    <a href="transaction_history.html" class="nav-item active">
      <span>明细</span>
    </a>
    <a href="settings.html" class="nav-item">
      <span>设置</span>
    </a>
  </nav>
</body>
</html>
