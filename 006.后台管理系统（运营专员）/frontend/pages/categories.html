<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分类管理 - 财务管家后台管理系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FFB7C5;
      --primary-dark: #FF8FA3;
      --secondary: #7DD3C0;
      --danger: #FF6B6B;
      --text: #2D2D2D;
      --text-light: #666;
      --text-lighter: #999;
      --bg: #FFF5F7;
      --card-bg: #FFFFFF;
      --shadow: 0 4px 20px rgba(255, 183, 197, 0.15);
      --sidebar-width: 240px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--card-bg);
      border-right: 1px solid rgba(255, 183, 197, 0.2);
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 100;
    }

    .sidebar-header { padding: 24px 20px; border-bottom: 1px solid rgba(255, 183, 197, 0.2); }
    .sidebar-header h1 { font-size: 20px; color: var(--primary-dark); }
    .sidebar-header p { font-size: 12px; color: var(--text-lighter); margin-top: 4px; }

    .nav-menu { padding: 16px 0; }

    .nav-item {
      display: block;
      padding: 14px 20px;
      color: var(--text-light);
      text-decoration: none;
      transition: all 0.3s;
      border-left: 3px solid transparent;
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(255, 183, 197, 0.1);
      color: var(--primary-dark);
      border-left-color: var(--primary);
    }

    .main { flex: 1; margin-left: var(--sidebar-width); padding: 24px; }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .page-title { font-size: 24px; font-weight: 700; }

    .btn-logout {
      padding: 8px 16px;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .tab-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 12px 24px;
      background: white;
      border: 2px solid #eee;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .table-container {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 16px; text-align: left; border-bottom: 1px solid #f0f0f0; }
    th { background: #fafafa; font-weight: 600; color: var(--text-light); font-size: 14px; }
    td { font-size: 14px; }

    .category-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-icon { font-size: 20px; }
    .category-color {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .system-tag {
      padding: 4px 8px;
      background: var(--primary);
      color: white;
      border-radius: 4px;
      font-size: 12px;
    }

    .loading { text-align: center; padding: 40px; color: var(--text-lighter); }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .main { margin-left: 0; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>财务管家</h1>
      <p>后台管理系统</p>
    </div>
    <nav class="nav-menu">
      <a href="dashboard.html" class="nav-item">数据概览</a>
      <a href="users.html" class="nav-item">用户管理</a>
      <a href="transactions.html" class="nav-item">交易记录</a>
      <a href="statistics.html" class="nav-item">数据统计</a>
      <a href="categories.html" class="nav-item active">分类管理</a>
      <a href="account_types.html" class="nav-item">账户类型</a>
    </nav>
  </aside>

  <main class="main">
    <header class="page-header">
      <h2 class="page-title">分类管理</h2>
      <button class="btn-logout" onclick="logout()">退出登录</button>
    </header>

    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('expense')">支出分类</button>
      <button class="tab-btn" onclick="switchTab('income')">收入分类</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>分类</th>
            <th>图标</th>
            <th>颜色</th>
            <th>类型</th>
          </tr>
        </thead>
        <tbody id="categoryTable">
          <tr><td colspan="4" class="loading">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const API_BASE = 'http://localhost:3002';
    let currentType = 'expense';

    async function checkLogin() {
      const token = localStorage.getItem('adminToken');
      if (!token) { window.location.href = 'login.html'; return; }
      try {
        const res = await fetch(`${API_BASE}/api/admin/verify`, { headers: { 'Authorization': `Bearer ${token}` }});
        if (!res.ok) throw new Error();
      } catch { logout(); }
    }

    async function loadCategories() {
      const token = localStorage.getItem('adminToken');
      try {
        const res = await fetch(`${API_BASE}/api/admin/categories?type=${currentType}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const result = await res.json();

        if (result.success) {
          renderCategories(result.data);
        }
      } catch (e) {
        console.error(e);
      }
    }

    function renderCategories(list) {
      const tbody = document.getElementById('categoryTable');
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="loading">暂无数据</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(c => `
        <tr>
          <td>
            <div class="category-item">
              <span class="category-icon">${c.icon}</span>
              <span>${c.name}</span>
              ${c.is_system ? '<span class="system-tag">系统</span>' : ''}
            </div>
          </td>
          <td>${c.icon}</td>
          <td>
            <span class="category-color" style="background: ${c.color}"></span>
            <span style="color: var(--text-light); font-size: 12px;">${c.color}</span>
          </td>
          <td>${c.type_name === 'expense' ? '支出' : '收入'}</td>
        </tr>
      `).join('');
    }

    function switchTab(type) {
      currentType = type;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      loadCategories();
    }

    function logout() {
      localStorage.removeItem('adminToken');
      localStorage.removeItem('adminInfo');
      window.location.href = 'login.html';
    }

    checkLogin();
    loadCategories();
  </script>
</body>
</html>
