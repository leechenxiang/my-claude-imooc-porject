<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据概览 - 财务管家后台管理系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #FFB7C5;
      --primary-dark: #FF8FA3;
      --secondary: #7DD3C0;
      --accent: #C9B8E8;
      --danger: #FF6B6B;
      --warning: #FFB347;
      --text: #2D2D2D;
      --text-light: #666;
      --text-lighter: #999;
      --bg: #FFF5F7;
      --card-bg: #FFFFFF;
      --shadow: 0 4px 20px rgba(255, 183, 197, 0.15);
      --sidebar-width: 240px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }

    /* 侧边栏 */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--card-bg);
      border-right: 1px solid rgba(255, 183, 197, 0.2);
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 100;
    }

    .sidebar-header {
      padding: 24px 20px;
      border-bottom: 1px solid rgba(255, 183, 197, 0.2);
    }

    .sidebar-header h1 {
      font-size: 20px;
      color: var(--primary-dark);
    }

    .sidebar-header p {
      font-size: 12px;
      color: var(--text-lighter);
      margin-top: 4px;
    }

    .nav-menu {
      padding: 16px 0;
    }

    .nav-item {
      display: block;
      padding: 14px 20px;
      color: var(--text-light);
      text-decoration: none;
      transition: all 0.3s;
      border-left: 3px solid transparent;
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(255, 183, 197, 0.1);
      color: var(--primary-dark);
      border-left-color: var(--primary);
    }

    .nav-item.active {
      font-weight: 600;
    }

    /* 主内容区 */
    .main {
      flex: 1;
      margin-left: var(--sidebar-width);
      padding: 24px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-info span {
      color: var(--text-light);
    }

    .btn-logout {
      padding: 8px 16px;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    /* 统计卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .stat-card h3 {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
    }

    .stat-card.income .value {
      color: var(--secondary);
    }

    .stat-card.expense .value {
      color: var(--danger);
    }

    .stat-card.balance .value {
      color: var(--primary-dark);
    }

    /* 图表区域 */
    .chart-container {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .chart-container h2 {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .chart-wrapper {
      position: relative;
      height: 300px;
    }

    /* 加载状态 */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-lighter);
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .main {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>财务管家</h1>
      <p>后台管理系统</p>
    </div>
    <nav class="nav-menu">
      <a href="dashboard.html" class="nav-item active">数据概览</a>
      <a href="users.html" class="nav-item">用户管理</a>
      <a href="transactions.html" class="nav-item">交易记录</a>
      <a href="statistics.html" class="nav-item">数据统计</a>
      <a href="categories.html" class="nav-item">分类管理</a>
      <a href="account_types.html" class="nav-item">账户类型</a>
    </nav>
  </aside>

  <!-- 主内容区 -->
  <main class="main">
    <header class="page-header">
      <h2 class="page-title">数据概览</h2>
      <div class="user-info">
        <span id="adminNickname"></span>
        <button class="btn-logout" onclick="logout()">退出登录</button>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>总用户数</h3>
        <div class="value" id="totalUsers">-</div>
      </div>
      <div class="stat-card">
        <h3>今日新增</h3>
        <div class="value" id="todayUsers">-</div>
      </div>
      <div class="stat-card">
        <h3>本月收入</h3>
        <div class="value income" id="monthIncome">-</div>
      </div>
      <div class="stat-card">
        <h3>本月支出</h3>
        <div class="value expense" id="monthExpense">-</div>
      </div>
    </div>

    <div class="chart-container">
      <h2>最近7天用户增长趋势</h2>
      <div class="chart-wrapper">
        <canvas id="trendChart"></canvas>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = 'http://localhost:3002';
    let trendChart = null;

    // 检查登录
    async function checkLogin() {
      const token = localStorage.getItem('adminToken');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }

      const info = JSON.parse(localStorage.getItem('adminInfo') || '{}');
      document.getElementById('adminNickname').textContent = info.nickname || info.username;

      // 验证token
      try {
        const res = await fetch(`${API_BASE}/api/admin/verify`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error();
      } catch {
        logout();
      }
    }

    // 加载概览数据
    async function loadOverview() {
      const token = localStorage.getItem('adminToken');
      try {
        const res = await fetch(`${API_BASE}/api/admin/statistics/overview`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const result = await res.json();

        if (result.success) {
          const data = result.data;
          document.getElementById('totalUsers').textContent = data.totalUsers;
          document.getElementById('todayUsers').textContent = data.todayNewUsers;
          document.getElementById('monthIncome').textContent = formatMoney(data.monthIncome);
          document.getElementById('monthExpense').textContent = formatMoney(data.monthExpense);
        }
      } catch (e) {
        console.error(e);
      }
    }

    // 加载趋势图
    async function loadTrend() {
      const token = localStorage.getItem('adminToken');
      try {
        const res = await fetch(`${API_BASE}/api/admin/statistics/trend`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const result = await res.json();

        if (result.success) {
          renderTrendChart(result.data);
        }
      } catch (e) {
        console.error(e);
      }
    }

    // 渲染趋势图
    function renderTrendChart(data) {
      const ctx = document.getElementById('trendChart').getContext('2d');
      const labels = data.map(d => d.date.slice(5));
      const values = data.map(d => d.newUsers);

      if (trendChart) trendChart.destroy();

      trendChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: '新增用户',
            data: values,
            borderColor: '#FFB7C5',
            backgroundColor: 'rgba(255, 183, 197, 0.1)',
            fill: true,
            tension: 0.4,
            pointBackgroundColor: '#FFB7C5',
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: { beginAtZero: true }
          }
        }
      });
    }

    // 格式化金额
    function formatMoney(amount) {
      return '¥' + (amount || 0).toLocaleString();
    }

    // 退出登录
    function logout() {
      localStorage.removeItem('adminToken');
      localStorage.removeItem('adminInfo');
      window.location.href = 'login.html';
    }

    // 初始化
    checkLogin();
    loadOverview();
    loadTrend();
  </script>
</body>
</html>
