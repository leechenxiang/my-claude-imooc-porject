<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 财务管家后台管理系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FFB7C5;
      --primary-dark: #FF8FA3;
      --secondary: #7DD3C0;
      --accent: #C9B8E8;
      --danger: #FF6B6B;
      --success: #7DD3C0;
      --text: #2D2D2D;
      --text-light: #666;
      --bg: #FFF5F7;
      --card-bg: #FFFFFF;
      --shadow: 0 4px 20px rgba(255, 183, 197, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(circle at 20% 80%, rgba(255, 183, 197, 0.3), transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(201, 184, 232, 0.3), transparent 50%);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: var(--shadow);
      border: 2px solid rgba(255, 183, 197, 0.3);
    }

    .logo {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo h1 {
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 32px;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }

    .logo p {
      color: var(--text-light);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-weight: 500;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #EEE;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.3s;
      background: #FAFAFA;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      background: #FFF;
      box-shadow: 0 0 0 4px rgba(255, 183, 197, 0.2);
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 183, 197, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .error-message {
      background: rgba(255, 107, 107, 0.1);
      color: var(--danger);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .error-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo">
        <h1>财务管家</h1>
        <p>后台管理系统</p>
      </div>

      <div class="error-message" id="errorMessage"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="username" name="username" placeholder="请输入管理员账号" required>
        </div>

        <div class="form-group">
          <label>密码</label>
          <input type="password" id="password" name="password" placeholder="请输入密码" required>
        </div>

        <button type="submit" class="btn btn-primary">登录</button>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3002';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('errorMessage');

      errorEl.classList.remove('show');

      if (!username || !password) {
        errorEl.textContent = '请输入用户名和密码';
        errorEl.classList.add('show');
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (result.success) {
          // 保存token
          localStorage.setItem('adminToken', result.data.token);
          localStorage.setItem('adminInfo', JSON.stringify(result.data));
          // 跳转到首页
          window.location.href = 'dashboard.html';
        } else {
          errorEl.textContent = result.message || '登录失败';
          errorEl.classList.add('show');
        }
      } catch (error) {
        errorEl.textContent = '网络错误，请稍后重试';
        errorEl.classList.add('show');
      }
    });
  </script>
</body>
</html>
