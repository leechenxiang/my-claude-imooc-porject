<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据统计 - 财务管家后台管理系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #FFB7C5;
      --primary-dark: #FF8FA3;
      --secondary: #7DD3C0;
      --accent: #C9B8E8;
      --danger: #FF6B6B;
      --text: #2D2D2D;
      --text-light: #666;
      --text-lighter: #999;
      --bg: #FFF5F7;
      --card-bg: #FFFFFF;
      --shadow: 0 4px 20px rgba(255, 183, 197, 0.15);
      --sidebar-width: 240px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--card-bg);
      border-right: 1px solid rgba(255, 183, 197, 0.2);
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 100;
    }

    .sidebar-header { padding: 24px 20px; border-bottom: 1px solid rgba(255, 183, 197, 0.2); }
    .sidebar-header h1 { font-size: 20px; color: var(--primary-dark); }
    .sidebar-header p { font-size: 12px; color: var(--text-lighter); margin-top: 4px; }

    .nav-menu { padding: 16px 0; }

    .nav-item {
      display: block;
      padding: 14px 20px;
      color: var(--text-light);
      text-decoration: none;
      transition: all 0.3s;
      border-left: 3px solid transparent;
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(255, 183, 197, 0.1);
      color: var(--primary-dark);
      border-left-color: var(--primary);
    }

    .main { flex: 1; margin-left: var(--sidebar-width); padding: 24px; }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .page-title { font-size: 24px; font-weight: 700; }

    .btn-logout {
      padding: 8px 16px;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .filter-bar { margin-bottom: 20px; }
    .filter-bar select {
      padding: 10px 14px;
      border: 2px solid #EEE;
      border-radius: 10px;
      font-size: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .stat-card h3 { font-size: 14px; color: var(--text-light); margin-bottom: 8px; }
    .stat-card .value { font-size: 28px; font-weight: 700; }
    .stat-card.income .value { color: var(--secondary); }
    .stat-card.expense .value { color: var(--danger); }

    .chart-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .chart-container {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .chart-container h2 { font-size: 18px; margin-bottom: 20px; }
    .chart-wrapper { position: relative; height: 300px; }

    .ranking-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .ranking-card h2 { font-size: 18px; margin-bottom: 20px; }
    .ranking-list { list-style: none; }
    .ranking-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .ranking-item:last-child { border-bottom: none; }
    .ranking-item .rank { font-weight: 700; color: var(--primary-dark); width: 30px; }
    .ranking-item .username { flex: 1; }
    .ranking-item .amount { color: var(--danger); font-weight: 600; }

    .loading { text-align: center; padding: 40px; color: var(--text-lighter); }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .main { margin-left: 0; }
      .chart-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>财务管家</h1>
      <p>后台管理系统</p>
    </div>
    <nav class="nav-menu">
      <a href="dashboard.html" class="nav-item">数据概览</a>
      <a href="users.html" class="nav-item">用户管理</a>
      <a href="transactions.html" class="nav-item">交易记录</a>
      <a href="statistics.html" class="nav-item active">数据统计</a>
      <a href="categories.html" class="nav-item">分类管理</a>
      <a href="account_types.html" class="nav-item">账户类型</a>
    </nav>
  </aside>

  <main class="main">
    <header class="page-header">
      <h2 class="page-title">数据统计</h2>
      <button class="btn-logout" onclick="logout()">退出登录</button>
    </header>

    <div class="filter-bar">
      <select id="yearFilter" onchange="loadStatistics()">
        <option value="2026">2026年</option>
        <option value="2025">2025年</option>
        <option value="2024">2024年</option>
      </select>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>年度收入</h3>
        <div class="value income" id="yearIncome">-</div>
      </div>
      <div class="stat-card">
        <h3>年度支出</h3>
        <div class="value expense" id="yearExpense">-</div>
      </div>
      <div class="stat-card">
        <h3>年度结余</h3>
        <div class="value" id="yearBalance">-</div>
      </div>
    </div>

    <div class="chart-row">
      <div class="chart-container">
        <h2>月度趋势</h2>
        <div class="chart-wrapper">
          <canvas id="monthlyChart"></canvas>
        </div>
      </div>
      <div class="chart-container">
        <h2>支出分类占比</h2>
        <div class="chart-wrapper">
          <canvas id="categoryChart"></canvas>
        </div>
      </div>
    </div>

    <div class="chart-row">
      <div class="ranking-card">
        <h2>支出排行 TOP 10</h2>
        <ul class="ranking-list" id="expenseRanking"></ul>
      </div>
      <div class="ranking-card">
        <h2>收入排行 TOP 10</h2>
        <ul class="ranking-list" id="incomeRanking"></ul>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = 'http://localhost:3002';
    let monthlyChart = null;
    let categoryChart = null;

    async function checkLogin() {
      const token = localStorage.getItem('adminToken');
      if (!token) { window.location.href = 'login.html'; return; }
      try {
        const res = await fetch(`${API_BASE}/api/admin/verify`, { headers: { 'Authorization': `Bearer ${token}` }});
        if (!res.ok) throw new Error();
      } catch { logout(); }
    }

    async function loadStatistics() {
      const token = localStorage.getItem('adminToken');
      const year = document.getElementById('yearFilter').value;

      try {
        const [globalRes, rankingRes] = await Promise.all([
          fetch(`${API_BASE}/api/admin/statistics/global?year=${year}`, { headers: { 'Authorization': `Bearer ${token}` }}),
          fetch(`${API_BASE}/api/admin/statistics/ranking?year=${year}`, { headers: { 'Authorization': `Bearer ${token}` }})
        ]);

        const globalData = await globalRes.json();
        const rankingData = await rankingRes.json();

        if (globalData.success) {
          document.getElementById('yearIncome').textContent = '¥' + globalData.data.yearIncome.toLocaleString();
          document.getElementById('yearExpense').textContent = '¥' + globalData.data.yearExpense.toLocaleString();
          document.getElementById('yearBalance').textContent = '¥' + globalData.data.yearBalance.toLocaleString();

          renderMonthlyChart(globalData.data.monthlyData);
          renderCategoryChart(globalData.data.categoryStats);
        }

        if (rankingData.success) {
          renderRanking('expenseRanking', rankingData.data.expenseRanking);
          renderRanking('incomeRanking', rankingData.data.incomeRanking);
        }
      } catch (e) {
        console.error(e);
      }
    }

    function renderMonthlyChart(data) {
      const ctx = document.getElementById('monthlyChart').getContext('2d');
      if (monthlyChart) monthlyChart.destroy();

      monthlyChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: data.map(d => d.month + '月'),
          datasets: [
            { label: '收入', data: data.map(d => d.income), backgroundColor: '#7DD3C0' },
            { label: '支出', data: data.map(d => d.expense), backgroundColor: '#FF6B6B' }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'top' } },
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    function renderCategoryChart(data) {
      const ctx = document.getElementById('categoryChart').getContext('2d');
      if (categoryChart) categoryChart.destroy();

      categoryChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: data.map(d => d.icon + ' ' + d.name),
          datasets: [{ data: data.map(d => d.total), backgroundColor: data.map(d => d.color) }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'right' } }
        }
      });
    }

    function renderRanking(id, list) {
      const container = document.getElementById(id);
      container.innerHTML = list.map((u, i) => `
        <li class="ranking-item">
          <span class="rank">${i + 1}</span>
          <span class="username">${u.nickname || u.username}</span>
          <span class="amount">¥${parseFloat(u.total).toLocaleString()}</span>
        </li>
      `).join('');
    }

    function logout() {
      localStorage.removeItem('adminToken');
      localStorage.removeItem('adminInfo');
      window.location.href = 'login.html';
    }

    checkLogin();
    loadStatistics();
  </script>
</body>
</html>
