<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户详情 - 财务管家后台管理系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FFB7C5;
      --primary-dark: #FF8FA3;
      --secondary: #7DD3C0;
      --accent: #C9B8E8;
      --danger: #FF6B6B;
      --warning: #FFB347;
      --text: #2D2D2D;
      --text-light: #666;
      --text-lighter: #999;
      --bg: #FFF5F7;
      --card-bg: #FFFFFF;
      --shadow: 0 4px 20px rgba(255, 183, 197, 0.15);
      --sidebar-width: 240px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
    }

    .back-link {
      color: var(--primary-dark);
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .btn-logout {
      padding: 8px 16px;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .info-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .info-card h3 {
      font-size: 16px;
      color: var(--text-light);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f0f0f0;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
    }

    .info-label {
      color: var(--text-light);
    }

    .info-value {
      font-weight: 500;
    }

    .user-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 16px;
    }

    .stat-item {
      text-align: center;
      padding: 16px;
      background: #fafafa;
      border-radius: 12px;
    }

    .stat-item .value {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .stat-item .label {
      font-size: 12px;
      color: var(--text-lighter);
    }

    .accounts-list, .transactions-list {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .accounts-list h3, .transactions-list h3 {
      padding: 20px;
      border-bottom: 1px solid #f0f0f0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 14px 20px;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
    }

    th {
      background: #fafafa;
      font-weight: 600;
      color: var(--text-light);
      font-size: 14px;
    }

    td {
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-lighter);
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 20px;
    }

    .pagination button {
      padding: 8px 16px;
      border: 1px solid #eee;
      background: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .pagination span {
      color: var(--text-light);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div>
        <a href="users.html" class="back-link">← 返回用户列表</a>
        <h2 class="page-title" style="margin-top: 8px;">用户详情</h2>
      </div>
      <button class="btn-logout" onclick="logout()">退出登录</button>
    </header>

    <div class="info-grid">
      <div class="info-card" id="userInfo">
        <div class="loading">加载中...</div>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-card">
        <h3>账户列表</h3>
        <div id="accountsList">
          <div class="loading">加载中...</div>
        </div>
      </div>

      <div class="info-card">
        <h3>交易统计</h3>
        <div class="user-stats" id="transactionStats">
          <div class="loading">加载中...</div>
        </div>
      </div>
    </div>

    <div class="transactions-list">
      <h3>最近交易记录</h3>
      <table>
        <thead>
          <tr>
            <th>日期</th>
            <th>类型</th>
            <th>分类</th>
            <th>账户</th>
            <th>金额</th>
          </tr>
        </thead>
        <tbody id="transactionsTable">
          <tr><td colspan="5" class="loading">加载中...</td></tr>
        </tbody>
      </table>
      <div class="pagination">
        <button id="prevBtn" onclick="prevPage()">上一页</button>
        <span id="pageInfo">第 1 页</span>
        <button id="nextBtn" onclick="nextPage()">下一页</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3002';
    const userId = new URLSearchParams(window.location.search).get('id');
    let currentPage = 1;
    let totalPages = 1;
    let total = 0;

    // 检查登录
    async function checkLogin() {
      const token = localStorage.getItem('adminToken');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }
      if (!userId) {
        window.location.href = 'users.html';
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/api/admin/verify`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error();
      } catch {
        logout();
      }
    }

    // 加载用户详情
    async function loadUserDetail() {
      const token = localStorage.getItem('adminToken');
      try {
        const res = await fetch(`${API_BASE}/api/admin/users/${userId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const result = await res.json();

        if (result.success) {
          const { user, accounts, transactionStats } = result.data;
          renderUserInfo(user);
          renderAccounts(accounts);
          renderStats(transactionStats);
        }
      } catch (e) {
        console.error(e);
      }
    }

    // 渲染用户信息
    function renderUserInfo(user) {
      const container = document.getElementById('userInfo');
      container.innerHTML = `
        <h3>基本信息</h3>
        <div class="info-item">
          <span class="info-label">ID</span>
          <span class="info-value">${user.id}</span>
        </div>
        <div class="info-item">
          <span class="info-label">用户名</span>
          <span class="info-value">${user.username}</span>
        </div>
        <div class="info-item">
          <span class="info-label">昵称</span>
          <span class="info-value">${user.nickname || '-'}</span>
        </div>
        <div class="info-item">
          <span class="info-label">注册时间</span>
          <span class="info-value">${user.created_at ? user.created_at.slice(0, 19) : '-'}</span>
        </div>
      `;
    }

    // 渲染账户
    function renderAccounts(accounts) {
      const container = document.getElementById('accountsList');
      if (accounts.length === 0) {
        container.innerHTML = '<p style="color: #999;">暂无账户</p>';
        return;
      }
      container.innerHTML = accounts.map(a => `
        <div class="info-item">
          <span class="info-label">${a.icon} ${a.name}</span>
          <span class="info-value">¥${parseFloat(a.current_balance || 0).toLocaleString()}</span>
        </div>
      `).join('');
    }

    // 渲染统计
    function renderStats(stats) {
      const container = document.getElementById('transactionStats');
      container.innerHTML = `
        <div class="stat-item">
          <div class="value">¥${stats.totalIncome.toLocaleString()}</div>
          <div class="label">总收入</div>
        </div>
        <div class="stat-item" style="color: var(--danger);">
          <div class="value">¥${stats.totalExpense.toLocaleString()}</div>
          <div class="label">总支出</div>
        </div>
        <div class="stat-item">
          <div class="value">${stats.totalCount}</div>
          <div class="label">交易笔数</div>
        </div>
      `;
    }

    // 加载交易记录
    async function loadTransactions() {
      const token = localStorage.getItem('adminToken');
      try {
        const res = await fetch(`${API_BASE}/api/admin/users/${userId}/transactions?page=${currentPage}&pageSize=10`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const result = await res.json();

        if (result.success) {
          total = result.data.pagination.total;
          totalPages = result.data.pagination.totalPages;
          renderTransactions(result.data.transactions);
          updatePagination();
        }
      } catch (e) {
        console.error(e);
      }
    }

    // 渲染交易记录
    function renderTransactions(transactions) {
      const tbody = document.getElementById('transactionsTable');
      if (transactions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="loading">暂无记录</td></tr>';
        return;
      }
      tbody.innerHTML = transactions.map(t => `
        <tr>
          <td>${t.transaction_date}</td>
          <td style="color: ${t.type_name === 'income' ? '#7DD3C0' : '#FF6B6B'};">${t.type_name === 'income' ? '收入' : '支出'}</td>
          <td>${t.category_icon} ${t.category_name}</td>
          <td>${t.account_icon} ${t.account_name}</td>
          <td style="color: ${t.type_name === 'income' ? '#7DD3C0' : '#FF6B6B'};">${t.type_name === 'income' ? '+' : '-'}${parseFloat(t.amount).toLocaleString()}</td>
        </tr>
      `).join('');
    }

    // 更新分页
    function updatePagination() {
      document.getElementById('pageInfo').textContent = `第 ${currentPage} / ${totalPages} 页，共 ${total} 条`;
      document.getElementById('prevBtn').disabled = currentPage === 1;
      document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        loadTransactions();
      }
    }

    function nextPage() {
      if (currentPage < totalPages) {
        currentPage++;
        loadTransactions();
      }
    }

    // 退出登录
    function logout() {
      localStorage.removeItem('adminToken');
      localStorage.removeItem('adminInfo');
      window.location.href = 'login.html';
    }

    checkLogin();
    loadUserDetail();
    loadTransactions();
  </script>
</body>
</html>
