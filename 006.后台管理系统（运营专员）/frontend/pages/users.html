<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - 财务管家后台管理系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FFB7C5;
      --primary-dark: #FF8FA3;
      --secondary: #7DD3C0;
      --accent: #C9B8E8;
      --danger: #FF6B6B;
      --warning: #FFB347;
      --text: #2D2D2D;
      --text-light: #666;
      --text-lighter: #999;
      --bg: #FFF5F7;
      --card-bg: #FFFFFF;
      --shadow: 0 4px 20px rgba(255, 183, 197, 0.15);
      --sidebar-width: 240px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--card-bg);
      border-right: 1px solid rgba(255, 183, 197, 0.2);
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 100;
    }

    .sidebar-header {
      padding: 24px 20px;
      border-bottom: 1px solid rgba(255, 183, 197, 0.2);
    }

    .sidebar-header h1 {
      font-size: 20px;
      color: var(--primary-dark);
    }

    .sidebar-header p {
      font-size: 12px;
      color: var(--text-lighter);
      margin-top: 4px;
    }

    .nav-menu {
      padding: 16px 0;
    }

    .nav-item {
      display: block;
      padding: 14px 20px;
      color: var(--text-light);
      text-decoration: none;
      transition: all 0.3s;
      border-left: 3px solid transparent;
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(255, 183, 197, 0.1);
      color: var(--primary-dark);
      border-left-color: var(--primary);
    }

    .main {
      flex: 1;
      margin-left: var(--sidebar-width);
      padding: 24px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-logout {
      padding: 8px 16px;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    /* 搜索栏 */
    .search-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .search-bar input {
      flex: 1;
      max-width: 300px;
      padding: 12px 16px;
      border: 2px solid #EEE;
      border-radius: 10px;
      font-size: 14px;
    }

    .search-bar input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-search {
      padding: 12px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    /* 用户表格 */
    .table-container {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
    }

    th {
      background: #fafafa;
      font-weight: 600;
      color: var(--text-light);
      font-size: 14px;
    }

    td {
      font-size: 14px;
    }

    tr:hover {
      background: #fafafa;
    }

    .user-link {
      color: var(--primary-dark);
      text-decoration: none;
      font-weight: 500;
    }

    .user-link:hover {
      text-decoration: underline;
    }

    /* 分页 */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 20px;
    }

    .pagination button {
      padding: 8px 16px;
      border: 1px solid #eee;
      background: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .pagination span {
      color: var(--text-light);
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-lighter);
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .main {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>财务管家</h1>
      <p>后台管理系统</p>
    </div>
    <nav class="nav-menu">
      <a href="dashboard.html" class="nav-item">数据概览</a>
      <a href="users.html" class="nav-item active">用户管理</a>
      <a href="transactions.html" class="nav-item">交易记录</a>
      <a href="statistics.html" class="nav-item">数据统计</a>
      <a href="categories.html" class="nav-item">分类管理</a>
      <a href="account_types.html" class="nav-item">账户类型</a>
    </nav>
  </aside>

  <main class="main">
    <header class="page-header">
      <h2 class="page-title">用户管理</h2>
      <button class="btn-logout" onclick="logout()">退出登录</button>
    </header>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="搜索用户名或昵称...">
      <button class="btn-search" onclick="searchUsers()">搜索</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>用户名</th>
            <th>昵称</th>
            <th>注册时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr>
            <td colspan="5" class="loading">加载中...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <button id="prevBtn" onclick="prevPage()">上一页</button>
      <span id="pageInfo">第 1 页</span>
      <button id="nextBtn" onclick="nextPage()">下一页</button>
    </div>
  </main>

  <script>
    const API_BASE = 'http://localhost:3002';
    let currentPage = 1;
    let totalPages = 1;
    let searchKeyword = '';

    // 检查登录
    async function checkLogin() {
      const token = localStorage.getItem('adminToken');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/api/admin/verify`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error();
      } catch {
        logout();
      }
    }

    // 加载用户列表
    async function loadUsers() {
      const token = localStorage.getItem('adminToken');
      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = '<tr><td colspan="5" class="loading">加载中...</td></tr>';

      try {
        const url = `${API_BASE}/api/admin/users?page=${currentPage}&pageSize=20${searchKeyword ? '&search=' + searchKeyword : ''}`;
        const res = await fetch(url, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const result = await res.json();

        if (result.success) {
          totalPages = result.data.pagination.totalPages;
          renderUsers(result.data.users);
          updatePagination();
        }
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="5" class="loading">加载失败</td></tr>';
      }
    }

    // 渲染用户列表
    function renderUsers(users) {
      const tbody = document.getElementById('userTableBody');
      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="loading">暂无数据</td></tr>';
        return;
      }

      tbody.innerHTML = users.map(u => `
        <tr>
          <td>${u.id}</td>
          <td><a href="user_detail.html?id=${u.id}" class="user-link">${u.username}</a></td>
          <td>${u.nickname || '-'}</td>
          <td>${u.created_at ? u.created_at.slice(0, 19) : '-'}</td>
          <td><a href="user_detail.html?id=${u.id}" class="user-link">查看详情</a></td>
        </tr>
      `).join('');
    }

    // 更新分页
    function updatePagination() {
      document.getElementById('pageInfo').textContent = `第 ${currentPage} / ${totalPages} 页`;
      document.getElementById('prevBtn').disabled = currentPage === 1;
      document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    }

    // 搜索
    function searchUsers() {
      searchKeyword = document.getElementById('searchInput').value.trim();
      currentPage = 1;
      loadUsers();
    }

    // 分页
    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        loadUsers();
      }
    }

    function nextPage() {
      if (currentPage < totalPages) {
        currentPage++;
        loadUsers();
      }
    }

    // 退出登录
    function logout() {
      localStorage.removeItem('adminToken');
      localStorage.removeItem('adminInfo');
      window.location.href = 'login.html';
    }

    // 回车搜索
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchUsers();
    });

    checkLogin();
    loadUsers();
  </script>
</body>
</html>
